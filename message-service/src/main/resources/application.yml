server:
  port: 9001

spring:
  application:
    name: message-service
  datasource:
    url: jdbc:postgresql://localhost:5433/messages_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

jwt:
  secret: user-service-dev-secret-key-must-be-long-enough-256bits
  expiration-ms: 86400000

users:
  service-url: http://localhost:9000

server:
  port: ${SERVER_PORT:9001}

spring:
  application:
    name: message-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/messages_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

jwt:
  secret: ${JWT_SECRET:user-service-dev-secret-key-must-be-long-enough-256bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

users:
  service-url: ${USERS_SERVICE_URL:http://localhost:9000}

services:
  postgres:
    image: postgres:16
    container_name: messages-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages_db
    ports:
      - "5433:5432"
    volumes:
      - messages_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messages_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  message-service:
    build: ./message-service
    container_name: messages-service
    ports:
      - "9001:9001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messages_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: user-service-dev-secret-key-must-be-long-enough-256bits
      USERS_SERVICE_URL: http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  messages_pgdata:
